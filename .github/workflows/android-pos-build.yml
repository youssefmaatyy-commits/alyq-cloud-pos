name: Android POS APK & Mobile Screenshots

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish_release_v2_0_0:
    name: Upload Assets to Official GitHub Release ALYQ POS v2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag v2.0.0 (a04f07265879fdd2fd514fc7b5d930e5fa2d56b5)
        uses: actions/checkout@v4
        with:
          ref: a04f07265879fdd2fd514fc7b5d930e5fa2d56b5
          fetch-depth: 0

      - name: Verify APK integrity & SHA-256 checksum
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "a04f07265879fdd2fd514fc7b5d930e5fa2d56b5"
          sha256sum -c releases/ALYQ-POS-v2.0.0-debug.apk.sha256
          grep -q "a3ed8537c64f123d78da21fafb6a6ddb82095d9d34ec32519db49ed5f5ff02bb" releases/ALYQ-POS-v2.0.0-debug.apk.sha256
          unzip -t releases/ALYQ-POS-v2.0.0-debug.apk >/dev/null
          unzip -p releases/ALYQ-POS-v2.0.0-debug.apk assets/public/index.html | grep -q "https://zeaacjmmvyuwzmkgxhqf.supabase.co"
          echo "✓ APK integrity, SHA-256, and Production Mode verified on a04f07265879fdd2fd514fc7b5d930e5fa2d56b5"

      - name: Upload APK assets to GitHub Release v2.0.0
        run: |
          gh release upload v2.0.0 \
            releases/ALYQ-POS-v2.0.0-debug.apk \
            releases/ALYQ-POS-v2.0.0-debug.apk.sha256 \
            releases/apk-metadata.json \
            --repo youssefmaatyy-commits/alyq-cloud-pos \
            --clobber
