name: Android POS APK & Mobile Screenshots

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android_pos:
    name: Build ALYQ POS v2.0.0 Production-Mode APK
    if: "!contains(github.event.head_commit.message, '[skip android-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Production-Mode Web Bundle & Compile Android APK (eg.alyq.management v2.0.0)
        run: |
          node -e '
            const fs = require("node:fs");
            (async () => {
              const res = await fetch("https://alyq-store.vercel.app/");
              if (!res.ok) throw new Error("Failed to reach production origin: " + res.status);
              const html = await res.text();
              const urlMatch = html.match(/https:\/\/[a-z0-9]+\.supabase\.co/);
              const keyMatch = html.match(/eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}/);
              if (!urlMatch || !keyMatch) throw new Error("Could not resolve public client configuration");
              fs.writeFileSync(".env.production.local", "VITE_SUPABASE_URL=" + urlMatch[0] + "\nVITE_SUPABASE_ANON_KEY=" + keyMatch[0] + "\n", { mode: 0o600 });
              console.log("Configured Production Mode targeting Supabase host:", new URL(urlMatch[0]).host);
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '
          npm run build
          rm -f .env.production.local
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ALYQ-POS-v2.0.0-debug.apk
          rm -rf android/app/src/main/assets/public android/app/build android/.gradle dist
          git checkout -- android/ || true
          git clean -fd android/ || true

      - name: Verify APK Production Mode & Generate Metadata
        run: |
          unzip -p releases/ALYQ-POS-v2.0.0-debug.apk assets/public/index.html | grep -q "https://zeaacjmmvyuwzmkgxhqf.supabase.co"
          echo "✓ Verified APK is compiled in Production Mode targeting zeaacjmmvyuwzmkgxhqf.supabase.co"
          sha256sum releases/ALYQ-POS-v2.0.0-debug.apk > releases/ALYQ-POS-v2.0.0-debug.apk.sha256
          APK_BYTES=$(stat -c%s releases/ALYQ-POS-v2.0.0-debug.apk)
          APK_SHA256=$(awk '{print $1}' releases/ALYQ-POS-v2.0.0-debug.apk.sha256)
          APKSIGNER_BIN=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)/apksigner
          if [ -x "$APKSIGNER_BIN" ]; then
            CERT_INFO=$("$APKSIGNER_BIN" verify --print-certs releases/ALYQ-POS-v2.0.0-debug.apk | head -n 6 | tr '\n' ' ' | sed 's/"/\\"/g')
          else
            CERT_INFO="Android Debug v2/v3 APK Signature Scheme"
          fi
          cat > releases/apk-metadata.json <<EOF
          {
            "appName": "ALYQ POS",
            "applicationId": "eg.alyq.management",
            "versionCode": 2,
            "versionName": "2.0.0",
            "minSdkVersion": 24,
            "targetSdkVersion": 36,
            "runtimeMode": "production-supabase",
            "supabaseProjectHost": "zeaacjmmvyuwzmkgxhqf.supabase.co",
            "buildType": "debug-signed-installable",
            "fileName": "releases/ALYQ-POS-v2.0.0-debug.apk",
            "sizeBytes": ${APK_BYTES},
            "sha256": "${APK_SHA256}",
            "signingSummary": "${CERT_INFO}",
            "builtAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload APK and screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: alyq-pos-v2.0.0-android-deliverables
          path: |
            releases/ALYQ-POS-v2.0.0-debug.apk
            releases/ALYQ-POS-v2.0.0-debug.apk.sha256
            releases/apk-metadata.json
            docs/screenshots/android-pos/*.png
          retention-days: 14

      - name: Commit Production-Mode APK to session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/ALYQ-POS-v2.0.0-debug.apk releases/ALYQ-POS-v2.0.0-debug.apk.sha256 releases/apk-metadata.json
          git commit -m "chore(android): package ALYQ POS v2.0.0 APK in Production Mode (zeaacjmmvyuwzmkgxhqf) [skip android-build]"
          npm run production:preflight
          git push origin HEAD:${{ github.ref_name }}
