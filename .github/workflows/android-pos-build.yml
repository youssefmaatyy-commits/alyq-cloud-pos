name: Android POS APK & Mobile Screenshots

on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_staging_models_apk:
    name: Build ALYQ POS Staging v2.0.0-models-staging Side-by-Side APK
    if: "!contains(github.event.head_commit.message, '[skip android-build]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Staging Web Bundle & Compile Side-by-Side Android APK (eg.alyq.management.staging)
        run: |
          node -e '
            const fs = require("node:fs");
            (async () => {
              const res = await fetch("https://bubvtxctwqsfohrkenej.supabase.co/functions/v1/staging-client-config");
              if (!res.ok) throw new Error("Failed to reach staging config endpoint: " + res.status);
              const cfg = await res.json();
              if (!cfg.url || !cfg.anonKey) throw new Error("Incomplete staging client configuration");
              const lines = [
                "VITE_SUPABASE_URL=" + cfg.url,
                "VITE_SUPABASE_ANON_KEY=" + cfg.anonKey,
                "VITE_CURRENCY=EGP",
                "VITE_APP_VERSION=2.0.0-models-staging"
              ];
              fs.writeFileSync(".env.production.local", lines.join("\n") + "\n", { mode: 0o600 });
              console.log("Configured Staging Mode targeting Supabase host:", new URL(cfg.url).host);
            })().catch((e) => { console.error(e.message); process.exit(1); });
          '
          npm run build
          rm -f .env.production.local
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug -PstagingBuild=true --no-daemon
          cd ..
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ALYQ-POS-v2.0.0-models-staging-debug.apk
          rm -rf android/app/src/main/assets/public android/app/build android/.gradle ios/App/App/public dist
          git checkout -- android/ ios/ || true
          git clean -fd android/ ios/ || true

      - name: Verify Side-by-Side Package ID, Staging Endpoint & Signatures
        run: |
          AAPT_BIN=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)/aapt
          BADGING=$("$AAPT_BIN" dump badging releases/ALYQ-POS-v2.0.0-models-staging-debug.apk)
          echo "$BADGING" | grep -E "^package:|^application-label:"
          echo "$BADGING" | grep -q "name='eg.alyq.management.staging'"
          echo "$BADGING" | grep -q "versionName='2.0.0-models-staging'"
          echo "$BADGING" | grep -q "application-label:'ALYQ POS Staging'"
          unzip -p releases/ALYQ-POS-v2.0.0-models-staging-debug.apk assets/public/index.html | grep -q "https://bubvtxctwqsfohrkenej.supabase.co"
          if unzip -p releases/ALYQ-POS-v2.0.0-models-staging-debug.apk assets/public/index.html | grep -q "zeaacjmmvyuwzmkgxhqf.supabase.co"; then
            echo "ERROR: Production Supabase host found in Staging APK!"
            exit 1
          fi
          echo "✓ Verified side-by-side package eg.alyq.management.staging connected strictly to bubvtxctwqsfohrkenej.supabase.co"

          sha256sum releases/ALYQ-POS-v2.0.0-models-staging-debug.apk > releases/ALYQ-POS-v2.0.0-models-staging-debug.apk.sha256
          APK_BYTES=$(stat -c%s releases/ALYQ-POS-v2.0.0-models-staging-debug.apk)
          APK_SHA256=$(awk '{print $1}' releases/ALYQ-POS-v2.0.0-models-staging-debug.apk.sha256)
          APKSIGNER_BIN=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)/apksigner
          CERT_INFO=$("$APKSIGNER_BIN" verify --print-certs releases/ALYQ-POS-v2.0.0-models-staging-debug.apk | head -n 6 | tr '\n' ' ' | sed 's/"/\\"/g')

          cat > releases/staging-apk-metadata.json <<EOF
          {
            "appName": "ALYQ POS Staging",
            "applicationId": "eg.alyq.management.staging",
            "coexistsWithOfficialApp": "eg.alyq.management (v2.0.0)",
            "fileProviderAuthority": "eg.alyq.management.staging.fileprovider",
            "versionCode": 2,
            "versionName": "2.0.0-models-staging",
            "minSdkVersion": 24,
            "targetSdkVersion": 36,
            "runtimeMode": "staging-supabase-0097",
            "supabaseProjectHost": "bubvtxctwqsfohrkenej.supabase.co",
            "buildType": "debug-signed-side-by-side-staging",
            "fileName": "releases/ALYQ-POS-v2.0.0-models-staging-debug.apk",
            "sizeBytes": ${APK_BYTES},
            "sha256": "${APK_SHA256}",
            "signingSummary": "${CERT_INFO}",
            "builtAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Commit Staging APK to session branch & Publish Experimental Pre-Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/ALYQ-POS-v2.0.0-models-staging-debug.apk releases/ALYQ-POS-v2.0.0-models-staging-debug.apk.sha256 releases/staging-apk-metadata.json
          git commit -m "chore(android): package side-by-side ALYQ POS Staging APK (eg.alyq.management.staging -> bubvtxctwqsfohrkenej) [skip android-build]"
          npm run production:preflight
          git push origin HEAD:${{ github.ref_name }}
          HEAD_SHA=$(git rev-parse HEAD)

          cat > /tmp/staging-release-notes.md << 'EOF'
          # 🧪 ALYQ POS v2.0.0-models-staging — Experimental Side-by-Side Staging Build (Android Only)

          > **⚠️ Experimental Staging Pre-Release:**
          > - Connects strictly to the isolated **Supabase Staging (`bubvtxctwqsfohrkenej.supabase.co`)** database with **Migration `0097` (Shared Barcode & Individual Variant Models)** applied.
          > - **Does NOT touch Production (`zeaacjmmvyuwzmkgxhqf.supabase.co`)**.
          > - Uses dedicated package ID **`eg.alyq.management.staging`** and label **`ALYQ POS Staging`** so it installs **side-by-side** alongside your official **`ALYQ POS v2.0.0` (`eg.alyq.management`)** app without replacing it, uninstalling it, or affecting any local data.

          ---

          ## 📦 Package & Coexistence Metadata

          | Field | Value |
          |---|---|
          | **App Name on Phone** | `ALYQ POS Staging` |
          | **Package ID (`applicationId`)** | `eg.alyq.management.staging` (coexists safely alongside `eg.alyq.management`) |
          | **FileProvider Authority** | `eg.alyq.management.staging.fileprovider` |
          | **Version** | `2.0.0-models-staging` (`versionCode: 2`, `minSdkVersion: 24`, `targetSdkVersion: 36`) |
          | **Connected Database** | **Supabase Staging (`bubvtxctwqsfohrkenej.supabase.co`)** — 97 migrations (`0001`–`0097`) |
          | **Staging Login Accounts** | `admin` / `admin123` · `cashier` / `cashier123` · `manager` / `manager123` |
          | **Seeded Multi-Model Products** | `BR101` (`شكل 1` qty 4, `شكل 2` qty 3, `شكل 3` qty 5) · `NK202` (`موديل كلاسيك` qty 6, `موديل ملكي` qty 5) |
          EOF

          if gh release view v2.0.0-models-staging --repo youssefmaatyy-commits/alyq-cloud-pos >/dev/null 2>&1; then
            gh release upload v2.0.0-models-staging \
              releases/ALYQ-POS-v2.0.0-models-staging-debug.apk \
              releases/ALYQ-POS-v2.0.0-models-staging-debug.apk.sha256 \
              releases/staging-apk-metadata.json \
              --repo youssefmaatyy-commits/alyq-cloud-pos \
              --clobber
          else
            gh release create v2.0.0-models-staging \
              releases/ALYQ-POS-v2.0.0-models-staging-debug.apk \
              releases/ALYQ-POS-v2.0.0-models-staging-debug.apk.sha256 \
              releases/staging-apk-metadata.json \
              --repo youssefmaatyy-commits/alyq-cloud-pos \
              --title "ALYQ POS v2.0.0-models-staging (Side-by-Side Staging APK)" \
              --notes-file /tmp/staging-release-notes.md \
              --target "$HEAD_SHA" \
              --prerelease
          fi
