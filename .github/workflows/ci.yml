name: CI

# Four jobs, each independent. Anything red blocks a merge:
#   static    lint, types (which also guarantee the EN/AR dictionary is
#             complete), production build
#   logic     every *.selftest.ts — money math, validation, permissions, repos
#   database  applies supabase/migrations to a real PostgreSQL engine and checks
#             the result satisfies the code (no Docker: @electric-sql/pglite)
#   e2e       the real app bundle driven in jsdom (smoke + auth flows)
#
# `live` is opt-in: set the repository variable ALYQ_LIVE_CI=true and the
# SUPABASE_TEST_* secrets to run the same E2E suites against a real project.
# It is the only job that can see the live-mode surface — the RLS policies and
# the anonymous storefront reads that migration 0030 hardened — and until it is
# switched on, `npm run db:check` is what proves those, by running the real
# policies against a real engine as each role (see supabase/tests/scenarios.sql).

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run production:preflight
      # ESLint, added with migration 0030's hardening pass. It is the cheapest of
      # the four gates and the only one that reads the code rather than running
      # it: the hooks rules catch a conditional hook, which every other job here
      # would sail through because the suites that exist do not render that
      # component. Warnings are reported and do not block; errors do.
      - run: npm run lint
      # `ar` is typed Record<TranslationKey, string>, so this also fails on a
      # missing or extra Arabic translation — no separate i18n check needed.
      - run: npm run typecheck
      - run: npm run build
      - name: Verify version channel artifacts
        run: |
          test -f dist/version.json
          test -f dist/releases/latest.json
          node -e "
            const m=require('./dist/version.json');
            if(m.schemaVersion!==1) throw new Error('bad schemaVersion');
            if(!m.current.version) throw new Error('missing version');
            if(!m.current.backend) throw new Error('missing backend compat');
            console.log('version.json OK:', m.current.version);
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  logic:
    name: Logic suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  database:
    name: Migrations & schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Applies every migration in order, twice (idempotency), then asserts the
      # schema satisfies what the repositories query. Three defects that made
      # the live schema unbuildable (0010's enum default, six invalid INSERT
      # policies, 0007's unescaped %) were all caught by this job's assertions.
      - run: npm run db:check

  e2e:
    name: E2E (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-bundle
          path: /tmp/alyq-app.mjs
          retention-days: 7

  live:
    name: Live Supabase E2E
    # Opt-in: repository variable ALYQ_LIVE_CI=true, plus the secrets below.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.ALYQ_LIVE_CI == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run test:e2e
      - run: npm run build
