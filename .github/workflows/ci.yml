name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Types & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Synthetic public configuration for OFFLINE artifact validation only.
    # A green CI build is not a commercial catalogue approval.
    env:
      VITE_APP_MODE: production
      VITE_RELEASE_ENVIRONMENT: preview
      VITE_SUPABASE_URL: https://isolated-release-check.invalid
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_fixture_only_0000000000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run production:preflight
      - uses: actions/upload-artifact@v4
        with:
          name: offline-production-contract-artifact
          path: dist
          retention-days: 7
  logic:
    name: Logic suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes actual Vite fail-closed builds, built-JS bootstrap, secret scan,
      # catalogue probe and release authorization tests, plus all logic suites.
      - run: npm test
  database:
    name: Migrations & schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Isolated PostgreSQL/PGlite only; no hosted project credentials.
      - run: npm run db:check
  e2e:
    name: E2E (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fresh bundles/processes, all 31 suites, no retry-on-failure or exclusions.
      - run: npm run test:e2e
      - run: npm run test:e2e
  release_gate:
    name: Release gate
    if: ${{ always() }}
    needs: [static, logic, database, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse release if any required job failed, cancelled or was skipped
        env:
          STATIC: ${{ needs.static.result }}
          LOGIC: ${{ needs.logic.result }}
          DATABASE: ${{ needs.database.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          test "$STATIC" = success
          test "$LOGIC" = success
          test "$DATABASE" = success
          test "$E2E" = success
