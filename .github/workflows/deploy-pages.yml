name: Deploy to GitHub Pages

# Publishes the default branch.
#
# This used to name one session branch — `arena/01a0900c-alyq-cloud-pos` — which
# still exists on the remote, so the workflow was not failing: it was succeeding,
# and publishing a build from an abandoned line of work while `main` moved on
# without it. A deploy that runs on the wrong ref is worse than one that does not
# run, because the site looks maintained.
#
# `workflow_dispatch` stays, so a rebuild can be triggered by hand without a
# commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # The same runtime every CI job uses. A deploy that builds on a Node
          # version nothing else tests on is a second build matrix nobody asked
          # for, and this one was two majors behind.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The static gate CI runs, repeated here on purpose: publishing is the one
      # step where a red build must not get through, and a merge can happen with
      # CI skipped or still running.
      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # `dist` is a single self-contained index.html: vite-plugin-singlefile
          # inlines the JS, the CSS and the brand mark as a data URL, so there is
          # no asset path for a Pages sub-directory to break. That is also why
          # this workflow needs no `base` in vite.config.ts.
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
