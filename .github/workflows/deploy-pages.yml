name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build Staging or Production bundle
        run: |
          if [[ "${{ github.ref_name }}" == arena/* ]]; then
            node -e '
              const fs = require("node:fs");
              (async () => {
                const res = await fetch("https://bubvtxctwqsfohrkenej.supabase.co/functions/v1/staging-client-config");
                if (!res.ok) throw new Error("Failed to reach staging config endpoint: " + res.status);
                const cfg = await res.json();
                if (!cfg.url || !cfg.anonKey) throw new Error("Incomplete staging client configuration");
                const lines = [
                  "VITE_SUPABASE_URL=" + cfg.url,
                  "VITE_SUPABASE_ANON_KEY=" + cfg.anonKey,
                  "VITE_CURRENCY=EGP",
                  "VITE_APP_VERSION=2.0.0-models-staging"
                ];
                fs.writeFileSync(".env.production.local", lines.join("\n") + "\n", { mode: 0o600 });
                console.log("Configured GitHub Pages Staging Preview targeting:", new URL(cfg.url).host);
              })().catch((e) => { console.error(e.message); process.exit(1); });
            '
          fi
          npm run build
          rm -f .env.production.local

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
