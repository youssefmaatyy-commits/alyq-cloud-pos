name: Windows preview installer & storefront screenshots

on:
  push:
    branches: ["arena/f498e340-alyq-cloud-pos"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-capture:
    name: Build unsigned 6.1.0 preview, test 6.0 upgrade, and capture storefront
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify version and data-preservation identity
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '6.1.0-preview.1') { throw "Unexpected preview version: $($pkg.version)" }
          if ($pkg.build.appId -ne 'eg.alyq.pos') { throw "Application ID changed unexpectedly" }
          if ($pkg.build.productName -ne 'ALYQ POS') { throw "Desktop product name changed unexpectedly" }
          if ($pkg.build.nsis.deleteAppDataOnUninstall -ne $false) { throw "NSIS data-preservation policy changed unexpectedly" }
          if (-not (Select-String -Path desktop/main.mjs -Pattern 'CONFIG_FILE = "desktop-config.v1.json"' -Quiet)) { throw "Desktop config filename changed unexpectedly" }
          if (-not (Select-String -Path desktop/main.mjs -Pattern 'path.join\(app.getPath\("userData"\), CONFIG_FILE\)' -Quiet)) { throw "Desktop configuration no longer uses the existing userData folder" }
          if (-not (Select-String -Path desktop/main.mjs -Pattern 'hash = "/login"' -Quiet)) { throw "Desktop login start route changed unexpectedly" }
          Write-Host "Version, Application ID, product name, userData path, configuration filename, login start route, and uninstall data preservation verified."

      - name: Typecheck and focused storefront/desktop/update checks
        run: |
          npm run typecheck
          npm test -- releaseCheck desktop v2 staffEntry
          npm run test:e2e -- storefront-v2 staff-entry

      - name: Build Windows x64 NSIS installer
        run: npm run desktop:package:win

      - name: Verify installer and create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = 'release/ALYQ-POS-Setup-6.1.0-preview.1-x64.exe'
          if (-not (Test-Path $installer)) { throw "Expected installer missing: $installer" }
          $signature = Get-AuthenticodeSignature $installer
          Write-Host "Authenticode status: $($signature.Status)"
          if ($signature.Status -ne 'NotSigned') { Write-Host "Unexpected signature status; verify certificate before distribution." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content "$installer.sha256" -Encoding ascii
          Write-Host "Unsigned manual-preview installer verified; SHA-256 $hash"

      - name: Install 6.0.0 and test preview upgrade in an isolated runner profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'ALYQ-POS-Setup-6.0.0-x64.exe'
          $checksumFile = "$baseline.sha256"
          $releaseBase = 'https://github.com/youssefmaatyy-commits/alyq-cloud-pos/releases/download/v2.1.0-rc1'
          Invoke-WebRequest "$releaseBase/ALYQ-POS-Setup-6.0.0-x64.exe" -OutFile $baseline
          Invoke-WebRequest "$releaseBase/ALYQ-POS-Setup-6.0.0-x64.exe.sha256" -OutFile $checksumFile
          $expected = (Get-Content $checksumFile -Raw) -match '(?i)^\s*([0-9a-f]{64})'
          if (-not $expected) { throw 'The published 6.0.0 checksum file is malformed.' }
          $expectedHash = $Matches[1].ToLowerInvariant()
          $actualHash = (Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'The published 6.0.0 installer checksum did not match.' }
          Write-Host "Existing 6.0.0 installer checksum verified."

          $baselineInstall = Start-Process -FilePath $baseline -ArgumentList '/S' -PassThru -Wait
          if ($baselineInstall.ExitCode -ne 0) { throw "6.0.0 silent installation failed with exit code $($baselineInstall.ExitCode)." }
          $oldExe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'ALYQ POS.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $oldExe) { throw 'Could not locate the installed 6.0.0 ALYQ POS executable.' }
          $oldProcess = Start-Process -FilePath $oldExe.FullName -ArgumentList @('--disable-gpu','--remote-debugging-port=9222','--remote-debugging-address=127.0.0.1','--remote-allow-origins=*') -PassThru -WindowStyle Hidden
          $env:ALYQ_EXPECTED_DESKTOP_VERSION = '6.0.0'
          node scripts/verify-windows-installed-app.mjs --port=9222 --version=6.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Installed 6.0.0 login/userData smoke check failed.' }
          if (-not $oldProcess.HasExited) { & taskkill.exe /PID $oldProcess.Id /T /F 2>$null | Out-Null }
          $config = Get-ChildItem $env:APPDATA -Filter 'desktop-config.v1.json' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $config) { throw 'Could not locate the 6.0.0 userData configuration under AppData.' }
          $userData = $config.DirectoryName
          $originalConfigHash = (Get-FileHash $config.FullName -Algorithm SHA256).Hash
          $configJson = Get-Content $config.FullName -Raw | ConvertFrom-Json
          if (-not $configJson.installationId) { throw 'The 6.0.0 configuration has no installation identity.' }
          $marker = Join-Path $userData 'arena-upgrade-preservation-check.txt'
          $markerValue = [guid]::NewGuid().ToString()
          Set-Content -Path $marker -Value $markerValue -NoNewline -Encoding ascii
          Start-Sleep -Seconds 2

          $preview = Start-Process -FilePath 'release/ALYQ-POS-Setup-6.1.0-preview.1-x64.exe' -ArgumentList '/S' -PassThru -Wait
          if ($preview.ExitCode -ne 0) { throw "Preview installer failed with exit code $($preview.ExitCode)." }
          $newExe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'ALYQ POS.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $newExe) { throw 'Could not locate the installed 6.1.0-preview.1 executable after upgrade.' }
          $newProcess = Start-Process -FilePath $newExe.FullName -ArgumentList @('--disable-gpu','--remote-debugging-port=9223','--remote-debugging-address=127.0.0.1','--remote-allow-origins=*') -PassThru -WindowStyle Hidden
          $env:ALYQ_EXPECTED_DESKTOP_VERSION = '6.1.0-preview.1'
          node scripts/verify-windows-installed-app.mjs --port=9223 --version=6.1.0-preview.1
          if ($LASTEXITCODE -ne 0) { throw 'Installed 6.1.0-preview.1 login/userData smoke check failed.' }
          if (-not $newProcess.HasExited) { & taskkill.exe /PID $newProcess.Id /T /F 2>$null | Out-Null }
          if (-not (Test-Path $marker) -or (Get-Content $marker -Raw) -ne $markerValue) { throw 'The 6.0.0 userData marker was not preserved by the 6.1.0 preview upgrade.' }
          if (-not (Test-Path $config.FullName)) { throw 'The 6.0.0 desktop configuration was removed by the preview upgrade.' }
          if ((Get-FileHash $config.FullName -Algorithm SHA256).Hash -ne $originalConfigHash) { throw 'The 6.0.0 desktop configuration changed during installer upgrade.' }
          Write-Host "SAFE UPGRADE PASS: installed the checksummed 6.0.0 installer, launched it to create a fresh isolated userData configuration, then upgraded to 6.1.0-preview.1; the configuration and sentinel were preserved byte-for-byte. No customer data or Production order was used."

      - name: Capture read-only Production baseline and EN/AR local-preview screenshots
        shell: pwsh
        run: |
          $server = Start-Process -FilePath 'npm.cmd' -ArgumentList @('run','preview','--','--host','127.0.0.1','--port','4173') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { $response = Invoke-WebRequest 'http://127.0.0.1:4173/' -TimeoutSec 2; if ($response.StatusCode -eq 200) { $ready = $true; break } } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Vite preview did not start.' }
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed.' }
            node scripts/capture-storefront-preview.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Storefront screenshot capture or responsive checks failed.' }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload unsigned Windows installer and checksum (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: ALYQ-POS-Setup-6.1.0-preview.1-x64
          path: |
            release/ALYQ-POS-Setup-6.1.0-preview.1-x64.exe
            release/ALYQ-POS-Setup-6.1.0-preview.1-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload before/after desktop/mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ALYQ-6.1.0-preview.1-storefront-before-after
          path: coverage/alyq-preview/*.png
          if-no-files-found: error
          retention-days: 14
